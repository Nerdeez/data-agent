# Bootstrap: apply once with kubectl. Argo CD then syncs k8s/apps from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-agent
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: data-agent-workshop
spec:
  project: default
  source:
    repoURL: https://github.com/Nerdeez/data-agent.git
    targetRevision: main
    path: k8s/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: data-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
